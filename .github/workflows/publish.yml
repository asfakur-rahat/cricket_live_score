# Publishes the package to pub.dev when a version tag such as v1.2.3 is
# pushed. The tag must match the version in pubspec.yaml.
#
# pub.dev accepts the upload only when automated publishing is turned on for
# this repository in the package's admin page on pub.dev.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: Check and publish
    # The golden images are rendered on macOS; Linux draws text slightly
    # differently, so the golden tests would fail there.
    runs-on: macos-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # pub.dev checks this token instead of a password
    steps:
      - uses: actions/checkout@v4

      # Sets up the token pub.dev accepts from GitHub Actions.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9 # keep in step with .fvmrc
          channel: stable
          cache: true

      - name: Check the tag matches the pubspec version
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pubspec.yaml"
            exit 1
          fi

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: dart pub publish --dry-run
      - run: dart pub publish --force
