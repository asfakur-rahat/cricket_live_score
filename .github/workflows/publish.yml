# Publishes the package to pub.dev when a version tag such as v1.2.3 is
# pushed. The tag must match the version in pubspec.yaml.
#
# pub.dev accepts the upload only when automated publishing is turned on for
# this repository in the package's admin page on pub.dev.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: Check and publish
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # pub.dev checks this token instead of a password
    steps:
      - uses: actions/checkout@v5

      # Sets up the token pub.dev accepts from GitHub Actions.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9 # keep in step with .fvmrc
          channel: stable
          cache: true

      - name: Check the tag matches the pubspec version
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pubspec.yaml"
            exit 1
          fi

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      # Golden images differ slightly between machines, so they are checked
      # locally only.
      - run: flutter test --exclude-tags golden

      - name: Keep the failure images of a failed test run
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-failures
          path: test/**/failures/
          if-no-files-found: ignore

      - run: dart pub publish --dry-run
      - run: dart pub publish --force
