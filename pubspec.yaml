name: cricket_live_score
description: >-
  Live cricket score widgets for Flutter: carousels, a score screen and sheet,
  a news-style ticker and a live-match button, with a pluggable data source.
version: 1.0.1
repository: https://github.com/asfakur-rahat/cricket_live_score
issue_tracker: https://github.com/asfakur-rahat/cricket_live_score/issues

screenshots:
  - description: A home page with a live score ticker, an inline match carousel and a live-match button.
    path: screenshots/home.png
  - description: The live score screen with phase and match-type filters.
    path: screenshots/screen.png
  - description: The live score screen as an adaptive grid on a tablet.
    path: screenshots/screen_tablet.png
  - description: The match carousel in a dialog, with page dots.
    path: screenshots/carousel.png
  - description: Live scores in a draggable bottom sheet.
    path: screenshots/sheet.png
  - description: The inline carousel showing several cards at once on a tablet.
    path: screenshots/inline_tablet.png
  - description: The score ticker in rotate and news-crawl modes.
    path: screenshots/ticker.png
  - description: The home page in dark mode.
    path: screenshots/home_dark.png
  - description: The floating live-match button.
    path: screenshots/fab.png

topics:
  - cricket
  - sports
  - live-score
  - widget

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  html: ^0.15.4
  http: ^1.2.0

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.3.0
